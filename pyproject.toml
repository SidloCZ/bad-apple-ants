[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bad-apple-earth-moon"
version = "1.0.0"
description = "Bad Apple!! where every frame is a real place: Earth's land and water with satellite photos, and the Moon"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "Pillow>=10.4",
    "rasterio>=1.3",
    "affine>=3.0",
    "pyproj>=3.7,<4",
    "scipy>=1.11",
    "shapely>=2.0",
]

[project.optional-dependencies]
# FAISS is only the reference backend of the first (Python) coastline matcher.
faiss = ["faiss-cpu>=1.8"]
test = ["pytest>=8"]

[project.scripts]
badapple-coastline = "badapple_coastline.cli:main"
badapple-moon = "badapple_moon.cli:main"

[tool.setuptools.packages.find]
include = ["badapple_media*", "badapple_coastline*", "badapple_moon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 120
target-version = ["py311"]
