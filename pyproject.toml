[project]
name = "badapple-ants"
version = "0.1.0"
description = "Prototype matching Bad Apple!! frames to real ant photographs on GPU"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx>=0.27.0",
    "imageio-ffmpeg>=0.5.1",
    "numpy>=1.26.0",
    "open-clip-torch>=2.29.0",
    "pillow>=10.4.0",
    "pytest>=8.3.0",
    "torch>=2.5.0",
    "tqdm>=4.66.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126" },
]
torchvision = [
    { index = "pytorch-cu126" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
