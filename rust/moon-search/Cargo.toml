[package]
name = "moon-search"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Exhaustive GPU pose search of Bad Apple!! frames on Kaguya and LROC images"
license = "MIT"
repository = "https://github.com/ikuto32/bad-apple-earth-moon"
publish = false

[dependencies]
anyhow = "1.0"
libloading = "0.8"
memmap2 = "0.9"
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
