[package]
name = "coastline-matcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Shape matcher: Bad Apple!! silhouettes against Earth's land/water mask"
license = "MIT"
repository = "https://github.com/ikuto32/bad-apple-earth-moon"
publish = false

[lib]
name = "coastline_matcher"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "coastline-search"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
matrixmultiply = "0.3.11"
memmap2 = "0.9"
rayon = "1.12"
rustfft = "6.4.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
